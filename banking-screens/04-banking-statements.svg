    <rect x="1170" y="42" width="150" height="52" rx="26.0" fill="#fff" stroke="#1f6fb2" stroke-width="1.5"/><text x="1245.0" y="75.0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f6fb2" text-anchor="middle">Customer App</text>
    <rect x="1335" y="42" width="130" height="52" rx="26.0" fill="#fff" stroke="#d8e4f0" stroke-width="1.5"/><text x="1400.0" y="75.0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#113b68" text-anchor="middle">Admin App</text>
    <rect x="1475" y="42" width="90" height="52" rx="26.0" fill="#fff" stroke="#d8e4f0" stroke-width="1.5"/><text x="1520.0" y="75.0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#113b68" text-anchor="middle">Help</text>
    <text x="48" y="164" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800" fill="#113b68" text-anchor="start">Statement Generation</text>
    <text font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#6e8098"><tspan x="48" y="214.0">Customers can request a recent statement</tspan><tspan x="48" y="243.7">extract, download it, and email it to</tspan><tspan x="48" y="273.4">themselves in one flow.</tspan></text>
    <rect x="48" y="260" width="1504" height="680" rx="18" fill="#ffffff" stroke="#d8e4f0" stroke-width="1"/><text x="82" y="324" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#113b68" text-anchor="start">Statements</text><text font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#6e8098"><tspan x="82" y="370.0">Generate recent account statement rows, download the</tspan><tspan x="82" y="399.7">workbook, and optionally email it to the account owner.</tspan></text><rect x="82" y="438" width="146" height="92" rx="24" fill="#1f6fb2" stroke="#1f6fb2" stroke-width="0"/><text x="155" y="478" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="155" y="512" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#dbeafe" text-anchor="middle">Rows</text><rect x="250" y="438" width="146" height="92" rx="24" fill="#f9fcff" stroke="#d8e4f0" stroke-width="1"/><text x="323" y="478" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#113b68" text-anchor="middle">10</text><text x="323" y="512" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#6e8098" text-anchor="middle">Rows</text><rect x="418" y="438" width="146" height="92" rx="24" fill="#f9fcff" stroke="#d8e4f0" stroke-width="1"/><text x="491" y="478" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#113b68" text-anchor="middle">25</text><text x="491" y="512" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#6e8098" text-anchor="middle">Rows</text><text x="610" y="468" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#113b68" text-anchor="start">Email Statement To</text><rect x="610" y="484" width="500" height="58" rx="14" fill="#fbfdff" stroke="#d8e4f0" stroke-width="1.2"/><text x="628" y="520.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#6e8098" text-anchor="start">soham@watermelon.us</text><rect x="1132" y="482" width="220" height="60" rx="30.0" fill="#1f6fb2" stroke="#1f6fb2" stroke-width="1"/><text x="1242.0" y="519.0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Get Statement</text><rect x="82" y="572" width="1438" height="320" rx="18" fill="#ffffff" stroke="#d8e4f0" stroke-width="1"/><text x="112" y="620" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#113b68" text-anchor="start">Account Statement</text><text x="112" y="656" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#6e8098" text-anchor="start">Downloaded workbook also appears here as a preview table.</text><rect x="112" y="690" width="1378" height="54" rx="12" fill="#f7fbff" stroke="#d8e4f0" stroke-width="1"/><text x="136" y="724" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#113b68" text-anchor="start">Transaction ID</text><text x="460" y="724" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#113b68" text-anchor="start">Type</text><text x="680" y="724" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#113b68" text-anchor="start">Counterparty</text><text x="1100" y="724" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#113b68" text-anchor="start">Amount</text><text x="1440" y="724" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#113b68" text-anchor="end">Balance After</text><rect x="112" y="752" width="1378" height="52" rx="12" fill="#ffffff" stroke="#d8e4f0" stroke-width="1"/><text x="136" y="786" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#113b68" text-anchor="start">TXN17751916142913055</text><text x="460" y="786" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#2e87cf" text-anchor="start">TRANSFER</text><text x="680" y="786" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#1b2f4b" text-anchor="start">Banking User 2</text><text x="1100" y="786" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#113b68" text-anchor="start">$500.00</text><text x="1440" y="786" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#113b68" text-anchor="end">$666.04</text><rect x="112" y="812" width="1378" height="52" rx="12" fill="#ffffff" stroke="#d8e4f0" stroke-width="1"/><text x="136" y="846" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#113b68" text-anchor="start">TXN17751800112233445</text><text x="460" y="846" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#29a36a" text-anchor="start">FUND</text><text x="680" y="846" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#1b2f4b" text-anchor="start">Admin Funding</text><text x="1100" y="846" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#113b68" text-anchor="start">$300.00</text><text x="1440" y="846" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#113b68" text-anchor="end">$1,166.04</text>
