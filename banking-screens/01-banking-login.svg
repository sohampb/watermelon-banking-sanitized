<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
    <rect width="1600" height="1000" fill="#eef5fb"/>
    <defs>
      <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f9ddcf"/>
        <stop offset="55%" stop-color="#f7fafc"/>
        <stop offset="100%" stop-color="#dff0e8"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#b8c7d8" flood-opacity="0.25"/>
      </filter>
    </defs>
    <rect x="20" y="20" width="1560" height="96" rx="28" fill="url(#hero)"/>
    <circle cx="60" cy="68" r="16" fill="#ff8f6c"/>
    <circle cx="78" cy="68" r="16" fill="#39a3ff" opacity="0.85"/>
    <text x="110" y="76" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#113b68" text-anchor="start">Watermelon Banking</text>
    <rect x="1170" y="42" width="150" height="52" rx="26.0" fill="#fff" stroke="#1f6fb2" stroke-width="1.5"/><text x="1245.0" y="75.0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f6fb2" text-anchor="middle">Customer App</text>
    <rect x="1335" y="42" width="130" height="52" rx="26.0" fill="#fff" stroke="#d8e4f0" stroke-width="1.5"/><text x="1400.0" y="75.0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#113b68" text-anchor="middle">Admin App</text>
    <rect x="1475" y="42" width="90" height="52" rx="26.0" fill="#fff" stroke="#d8e4f0" stroke-width="1.5"/><text x="1520.0" y="75.0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#113b68" text-anchor="middle">Help</text>
    <text x="48" y="164" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800" fill="#113b68" text-anchor="start">Secure Digital Banking</text>
    <text font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#6e8098"><tspan x="48" y="214.0">A refined demo portal for balances,</tspan><tspan x="48" y="243.7">transfers, OTP authorization, and</tspan><tspan x="48" y="273.4">statement retrieval.</tspan></text>
    <rect x="48" y="300" width="420" height="560" rx="34" fill="#195887" stroke="#195887" stroke-width="0"/><text x="86" y="358" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#dbeafe" text-anchor="start">Access details</text><rect x="302" y="330" width="126" height="40" rx="20.0" fill="#2d6ca4" stroke="#2d6ca4" stroke-width="1.5"/><text x="365.0" y="357.0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">PROTECTED DEMO</text><text x="86" y="428" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#dbeafe" text-anchor="start">Supported users</text><text x="86" y="494" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#fff" text-anchor="start">2 seeded accounts</text><rect x="86" y="560" width="220" height="54" rx="24" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="0"/><text x="196" y="594" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">bankinguser1 / password</text><rect x="86" y="628" width="220" height="54" rx="24" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="0"/><text x="196" y="662" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">bankinguser2 / password</text><text x="86" y="748" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#dbeafe" text-anchor="start">•  Simple captcha at sign-in</text><text x="86" y="790" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#dbeafe" text-anchor="start">•  Email OTP needed for transfers</text><text font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#dbeafe"><tspan x="86" y="832.0">• Downloadable and</tspan><tspan x="86" y="856.3">emailable Excel statements</tspan></text><rect x="540" y="300" width="580" height="560" rx="34" fill="#ffffff" stroke="#d8e4f0" stroke-width="1"/><text x="590" y="378" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800" fill="#113b68" text-anchor="start">Sign in</text><text font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#6e8098"><tspan x="590" y="430.0">Enter your credentials to continue</tspan><tspan x="590" y="459.7">to the banking dashboard.</tspan></text><text x="590" y="520" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#113b68" text-anchor="start">Username</text><rect x="590" y="540" width="460" height="62" rx="14" fill="#fbfdff" stroke="#d8e4f0" stroke-width="1.2"/><text x="608" y="578.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#6e8098" text-anchor="start">bankinguser1</text><text x="590" y="640" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#113b68" text-anchor="start">Password</text><rect x="590" y="660" width="460" height="62" rx="14" fill="#fbfdff" stroke="#d8e4f0" stroke-width="1.2"/><text x="608" y="698.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#6e8098" text-anchor="start">password</text><text x="590" y="760" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#113b68" text-anchor="start">Captcha</text><rect x="590" y="786" width="72" height="62" rx="16" fill="#fbfdff" stroke="#d8e4f0" stroke-width="1.2"/><text x="626" y="827" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#113b68" text-anchor="middle">3</text><text x="690" y="826" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#6e8098" text-anchor="middle">+</text><rect x="712" y="786" width="72" height="62" rx="16" fill="#fbfdff" stroke="#d8e4f0" stroke-width="1.2"/><text x="748" y="827" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#113b68" text-anchor="middle">9</text><text x="812" y="826" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#6e8098" text-anchor="middle">=</text><rect x="834" y="786" width="132" height="62" rx="14" fill="#fbfdff" stroke="#d8e4f0" stroke-width="1.2"/><text x="852" y="824.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#6e8098" text-anchor="start">?</text><rect x="590" y="868" width="180" height="52" rx="26.0" fill="#fff" stroke="#d8e4f0" stroke-width="1"/><text x="680.0" y="900.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#1b2f4b" text-anchor="middle">Refresh Captcha</text><rect x="850" y="868" width="200" height="56" rx="28.0" fill="#1f6fb2" stroke="#1f6fb2" stroke-width="1"/><text x="950.0" y="903.0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Sign In</text>
    </svg>