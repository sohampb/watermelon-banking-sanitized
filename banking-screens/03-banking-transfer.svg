    <text font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#6e8098"><tspan x="48" y="214.0">The customer app uses OTP-gated money</tspan><tspan x="48" y="243.7">movement with enabled beneficiaries only.</tspan></text>
    <rect x="48" y="260" width="1504" height="660" rx="18" fill="#ffffff" stroke="#d8e4f0" stroke-width="1"/><text x="82" y="324" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#113b68" text-anchor="start">Transfer Money</text><text font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#6e8098"><tspan x="82" y="370.0">Send OTP first, then complete the transfer with the OTP received by</tspan><tspan x="82" y="399.7">email.</tspan></text><text x="82" y="454" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#113b68" text-anchor="start">Destination Accounts</text><rect x="82" y="476" width="440" height="110" rx="20" fill="#f9fcff" stroke="#d8e4f0" stroke-width="1"/><text x="112" y="520" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#113b68" text-anchor="start">Banking User 2</text><text x="112" y="556" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#6e8098" text-anchor="start">bankinguser2 • WM-SAV-1002</text><text x="482" y="556" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#29a36a" text-anchor="end">Enabled</text><rect x="82" y="600" width="440" height="110" rx="20" fill="#fbfbfc" stroke="#d8e4f0" stroke-width="1"/><text x="112" y="644" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#8896a9" text-anchor="start">Demo Beneficiary 2</text><text x="112" y="680" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#9aa8b9" text-anchor="start">demo-beneficiary-2 • DEMO</text><text x="482" y="680" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#c26a48" text-anchor="end">Not enabled</text><text x="580" y="454" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#113b68" text-anchor="start">Transfer Details</text><text x="580" y="500" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#113b68" text-anchor="start">Transfer To Username</text><rect x="580" y="520" width="420" height="62" rx="14" fill="#fbfdff" stroke="#d8e4f0" stroke-width="1.2"/><text x="598" y="558.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#6e8098" text-anchor="start">bankinguser2</text><text x="1024" y="500" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#113b68" text-anchor="start">Amount (USD)</text><rect x="1024" y="520" width="220" height="62" rx="14" fill="#fbfdff" stroke="#d8e4f0" stroke-width="1.2"/><text x="1042" y="558.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#6e8098" text-anchor="start">45</text><text x="580" y="618" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#113b68" text-anchor="start">OTP Email Address</text><rect x="580" y="638" width="664" height="62" rx="14" fill="#fbfdff" stroke="#d8e4f0" stroke-width="1.2"/><text x="598" y="676.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#6e8098" text-anchor="start">soham@watermelon.us</text><text x="580" y="736" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#113b68" text-anchor="start">OTP</text><rect x="580" y="756" width="420" height="62" rx="14" fill="#fbfdff" stroke="#d8e4f0" stroke-width="1.2"/><text x="598" y="794.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#6e8098" text-anchor="start">Enter 6 digit OTP</text><rect x="1040" y="754" width="204" height="60" rx="30.0" fill="#1f6fb2" stroke="#1f6fb2" stroke-width="1"/><text x="1142.0" y="791.0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Transfer</text><rect x="580" y="840" width="210" height="56" rx="28.0" fill="#fff" stroke="#d8e4f0" stroke-width="1"/><text x="685.0" y="874.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#1b2f4b" text-anchor="middle">Send OTP</text><text font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#6e8098"><tspan x="820" y="846.0">OTP is emailed first, then used to authorize</tspan><tspan x="820" y="867.6">the transfer and update balances.</tspan></text>
